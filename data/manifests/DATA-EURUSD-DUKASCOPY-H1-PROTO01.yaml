description: "EUR/USD 1H aligned BID/ASK dataset for HYP-0001 PROTO-01, fixed to full years 2021-2025 before prototype result."

source:
  source_reference: "Dukascopy monthly EURUSD H1 BID/ASK candle files; 120 source files"
  snapshot_reference: "source-bundle-sha256:cf378faaae58424112d289315b2ec076f4100775f2613a5d2d685ec46a02aba4"

storage:
  format: "CSV"
  location: "data/derived/HYP-0001-PROTO-01-EURUSD-H1.csv"
  schema_reference: "data/manifests/DATA-EURUSD-DUKASCOPY-H1-PROTO01.schema.json"

coverage:
  start: "2021-01-01T00:00:00Z"
  end: "2025-12-31T23:00:00Z"
  scope: "EURUSD 1H tradable-hour BID/ASK bars for 2021-2025; 31,296 aligned rows; 12,528 closed-market calendar hours excluded; no missing tradable hours."

time_semantics:
