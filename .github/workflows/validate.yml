name: Validate ATS repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Validate structure and invariants
        run: uv run --frozen python tools/validate_repo.py

      - name: Emit environment fingerprint
        run: uv run --frozen python tools/environment_fingerprint.py

      - name: Verify environment baseline
        run: uv run --frozen pytest tests/test_environment_baseline.py

      - name: Lint environment baseline
        run: uv run --frozen ruff check tools/environment_fingerprint.py tests/test_environment_baseline.py
