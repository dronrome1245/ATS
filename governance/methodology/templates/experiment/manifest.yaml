# Правила экземпляра:
# - null означает отсутствие фактически зафиксированного значения, а не разрешение выдумать его.
# - неприменимое поле заменяется на строку NOT_APPLICABLE с объяснением в applicability_notes.
# - manifest фиксируется до использования результата как formal evidence.
